server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: carda-auth
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
app:
  mail-from: ${MAIL_FROM:}
  rate-limit-pepper: ${RATE_LIMIT_PEPPER}
logging:
  level:
    root: WARN
